version: '3.8'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Configuration des listeners
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      # Paramètres généraux
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    depends_on:
      - zookeeper
    restart: always

  nifi:
    image: apache/nifi:1.23.2
    container_name: nifi_ndox
    # Utilisez "0:0" pour forcer l'utilisateur root et le groupe root
    user: "0:0" 
    ports:
      - "8080:8080"
    environment:
      - NIFI_WEB_HTTP_PORT=8080
    volumes:
      - ./nifi_templates/nifi-data/flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - ./nifi_templates/nifi-data/content_repository:/opt/nifi/nifi-current/content_repository
      - ./nifi_templates/nifi-data/provenance_repository:/opt/nifi/nifi-current/provenance_repository
      - ./nifi_templates/nifi-data/state:/opt/nifi/nifi-current/state

  hbase:
    image: harisekhon/hbase:latest
    ports:
      - "9090:9090"
      - "16010:16010"

  hive-metastore:
    image: apache/hive:4.0.0
    environment:
      HIVE_METASTORE_DRIVER: org.apache.derby.jdbc.EmbeddedDriver
      SERVICE_NAME: metastore
    ports:
      - "10000:10000"
    volumes:
      - ../hive_setup.sql:/opt/hive/hive_setup.sql

  spark-master:
    image: apache/spark:3.5.7
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8081:8080" 
      - "7077:7077"

  spark-worker:
    image: apache/spark:3.5.7
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: "1G"

  postgres:
    image: postgres:13
    container_name: airflow_postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: "5s"
      timeout: "5s"
      retries: 5

  airflow:
    build:  .
    user: "50000:0"
    container_name: airflow_main
    depends_on:
      postgres:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8082:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__ENABLE_XCOM_PICKLING: "true"
    volumes:
      - ../dags:/opt/airflow/dags
      - ../models:/opt/models
      - ../airflow-data:/opt/airflow/data
      - ./requirements-airflow.txt:/requirements-airflow.txt
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install --no-cache-dir -r /requirements-airflow.txt
        
        echo "Tentative d'initialisation de la base de données..."
        airflow db init || echo "La base de données est déjà initialisée ou en cours."
        
        echo "Création de l'utilisateur admin..."
        airflow users create -u admin -p admin -f admin -l admin -r Admin -e admin@example.com || echo "L'utilisateur admin existe déjà."
        
        echo "Lancement du Scheduler..."
        airflow scheduler &
        
        echo "Lancement du Webserver..."
        exec airflow webserver
